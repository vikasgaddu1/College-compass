name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            college-dashboard/package-lock.json
            college-compass-app/package-lock.json
      - name: Install
        working-directory: college-dashboard
        run: npm ci
      - name: Validate data and TypeScript
        working-directory: college-dashboard
        run: |
          npm test
          npm run check
      - name: Build
        working-directory: college-dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build
      - name: Install app (college-compass-app)
        working-directory: college-compass-app
        run: npm ci
      - name: Test app
        working-directory: college-compass-app
        run: npm test
      - name: Build app
        working-directory: college-compass-app
        env:
          VITE_CC_CHATGPT_CLIENT_ID: ${{ secrets.VITE_CC_CHATGPT_CLIENT_ID }}
          VITE_CC_TOKEN_RELAY: ${{ secrets.VITE_CC_TOKEN_RELAY }}
        run: npm run build
      - name: Prepare Pages bundle
        run: |
          mkdir -p _site
          cp -r college-dashboard/dist/public/* _site/
          cp _site/index.html _site/404.html
          mkdir -p _site/app
          cp -r college-compass-app/dist/* _site/app/
          cp _site/app/index.html _site/app/404.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
