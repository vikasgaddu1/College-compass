name: Counselor billing reconcile

# Daily safety net for missed Stripe webhooks: calls the counselor-reconcile Edge Function, which compares
# every counselor's subscription with Stripe and fixes subscription_status / plan / past_due_since.
# Listings disappear on their own (the directory query applies the payment rules); this only corrects data
# a lost webhook left stale. Skips quietly until Supabase/Stripe are configured.
# Docs: college-compass-app/docs/COUNSELORS.md

on:
  schedule:
    - cron: "41 8 * * *" # daily, 08:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counselor-reconcile
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nspbxlnocelknibrajkv' }}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Reconcile counselor subscriptions with Stripe
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Reconcile skipped::SUPABASE_ACCESS_TOKEN is not set."
            exit 0
          fi
          # Service key via the Management API (same pattern as scripts/scorecard-load.mjs); masked, never printed.
          key="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
                 | jq -r '([.[] | select(.name == "service_role" and .api_key)] + [.[] | select(.type == "secret" and .api_key)]) | .[0].api_key // empty')"
          if [ -z "$key" ]; then
            echo "::warning title=Reconcile skipped::No service key returned by the Management API."
            exit 0
          fi
          echo "::add-mask::$key"
          code="$(curl -sS -o reconcile.json -w '%{http_code}' -X POST \
                    -H "Authorization: Bearer $key" -H "apikey: $key" -H "Content-Type: application/json" --data '{}' \
                    "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/counselor-reconcile")"
          summary="$(jq -c '{skipped, checked, errors, results, changed: ((.changed // []) | length)}' reconcile.json 2>/dev/null || echo '{}')"
          echo "HTTP $code $summary"
          echo "Counselor reconcile: HTTP $code $summary" >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            200)
              if jq -e '.skipped' reconcile.json >/dev/null 2>&1; then
                echo "::notice title=Reconcile skipped::Stripe secrets are not configured yet."
              fi ;;
            404) echo "::notice title=Reconcile skipped::counselor-reconcile is not deployed yet." ;;
            207) echo "::error title=Reconcile partly failed::Some counselors could not be checked; see the function logs."; exit 1 ;;
            *)   echo "::error title=Reconcile failed::HTTP $code"; exit 1 ;;
          esac
