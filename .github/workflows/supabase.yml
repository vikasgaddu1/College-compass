name: Shared college data (Supabase)

# Applies database migrations and loads federal College Scorecard data into the shared
# Supabase database. Holds college facts only — never student or user data.
# Setup: college-compass-app/docs/SHARED_DATA.md

on:
  push:
    branches: [main]
    paths:
      - "college-compass-app/supabase/migrations/**"
      - "college-compass-app/supabase/functions/**"
      - "college-compass-app/scripts/scorecard-load.mjs"
      - "college-compass-app/supabase/config.toml"
      - ".github/workflows/supabase.yml"
  schedule:
    - cron: "17 7 3 * *" # monthly; Scorecard data changes a few times a year and the load is idempotent
  workflow_dispatch:
    inputs:
      load_scorecard:
        description: "Load College Scorecard data after migrating"
        type: boolean
        default: true
      dry_run:
        description: "Scorecard: fetch and report only, no writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nspbxlnocelknibrajkv' }}

defaults:
  run:
    working-directory: college-compass-app

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check configuration
        id: gate
        working-directory: .
        run: |
          missing=""
          [ -n "$SUPABASE_PROJECT_REF" ]  || missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning title=Supabase skipped::Missing:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest
      - name: Apply migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
    outputs:
      ready: ${{ steps.gate.outputs.ready }}

  # The App Attest verifier (supabase/functions/attest). A separate job after `migrate` (it needs the
  # database functions from the migrations): a failed deploy can't affect migrations or the Scorecard
  # load, and the app falls back to unattested contributions while the function is missing.
  # --no-verify-jwt: the app sends the publishable key, which isn't a JWT; App Attest authenticates.
  functions:
    needs: migrate
    if: ${{ needs.migrate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the attest Edge Function
        run: supabase functions deploy attest --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  scorecard:
    needs: migrate
    if: ${{ needs.migrate.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.load_scorecard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Load College Scorecard
        run: |
          if [ -z "$SCORECARD_API_KEY" ]; then echo "::notice title=Scorecard::SCORECARD_API_KEY not set; using api.data.gov's public DEMO_KEY (30 requests/hour)"; fi
          node scripts/scorecard-load.mjs

  # ─────────────────────────── Counselor directory (docs/COUNSELORS.md) ───────────────────────────
  # Deploys the counselor Edge Functions after migrations, adds the counselor portal to the Auth redirect
  # allow-list, and warns about missing Stripe secrets. Separate job: a failure here never affects the
  # migration or Scorecard jobs. Stripe secrets are set by the owner (`supabase secrets set …`), never here.
  counselor-functions:
    needs: migrate
    if: ${{ needs.migrate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PORTAL_URL: ${{ vars.COUNSELOR_PORTAL_URL || 'https://vikasgaddu1.github.io/College-compass/app/counselors/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy counselor Edge Functions
        run: |
          for fn in counselor-checkout counselor-billing; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
          # Stripe and the daily reconcile call these without a Supabase user JWT; both check the caller themselves.
          for fn in stripe-webhook counselor-reconcile; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          done
      - name: Check Stripe secrets (names only)
        continue-on-error: true
        run: |
          # Lists names and digests only (never values); not echoed.
          listing="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          missing=""
          for k in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_MONTHLY STRIPE_PRICE_YEARLY; do
            grep -qw -- "$k" <<<"$listing" || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Counselor billing not configured::Missing function secrets:$missing (see college-compass-app/docs/COUNSELORS.md). Checkout returns 503 until they are set."
          else
            echo "Stripe function secrets are set."
          fi
      - name: Allow magic-link redirects to the counselor portal
        # `supabase db push` doesn't apply [auth] settings to a hosted project, so add the portal to
        # Authentication → URL Configuration through the Management API. Only ADDS entries; replaces the
        # Site URL only while it is still the localhost default.
        continue-on-error: true
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          cfg="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api")"
          patch="$(jq -c --arg u "$PORTAL_URL" '
            (.uri_allow_list // "" | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $have
            | ($have + [$u, ($u + "**")] | unique) as $want
            | {}
            + (if ($want | length) != ($have | unique | length) then {uri_allow_list: ($want | join(","))} else {} end)
            + (if ((.site_url // "") | test("^$|localhost|127\\.0\\.0\\.1")) then {site_url: $u} else {} end)' <<<"$cfg")"
          if [ "$patch" = "{}" ]; then
            echo "Auth URL configuration already includes the counselor portal."
          else
            curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data "$patch" "$api" >/dev/null
            echo "Updated Auth URL configuration: $(jq -c 'keys' <<<"$patch")"
          fi
  # ───────────────────────── end counselor directory ─────────────────────────
