name: Shared college data (Supabase)

# Applies database migrations and loads federal College Scorecard data into the shared
# Supabase database. Holds college facts only — never student or user data.
# Setup: college-compass-app/docs/SHARED_DATA.md

on:
  push:
    branches: [main]
    paths:
      - "college-compass-app/supabase/migrations/**"
      - "college-compass-app/scripts/scorecard-load.mjs"
      - ".github/workflows/supabase.yml"
  schedule:
    - cron: "17 7 3 * *" # monthly; Scorecard data changes a few times a year and the load is idempotent
  workflow_dispatch:
    inputs:
      load_scorecard:
        description: "Load College Scorecard data after migrating"
        type: boolean
        default: true
      dry_run:
        description: "Scorecard: fetch and report only, no writes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'nspbxlnocelknibrajkv' }}

defaults:
  run:
    working-directory: college-compass-app

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check configuration
        id: gate
        working-directory: .
        run: |
          missing=""
          [ -n "$SUPABASE_PROJECT_REF" ]  || missing="$missing SUPABASE_PROJECT_REF(variable)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning title=Supabase skipped::Missing:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest
      - name: Apply migrations
        if: steps.gate.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
    outputs:
      ready: ${{ steps.gate.outputs.ready }}

  scorecard:
    needs: migrate
    if: ${{ needs.migrate.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.load_scorecard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Load College Scorecard
        run: |
          if [ -z "$SCORECARD_API_KEY" ]; then echo "::notice title=Scorecard::SCORECARD_API_KEY not set; using api.data.gov's public DEMO_KEY (30 requests/hour)"; fi
          node scripts/scorecard-load.mjs
