name: iOS app (Capacitor)

# Compile check on every relevant push; optional manual TestFlight upload.
# Setup guide: college-compass-app/docs/APP_STORE.md

on:
  push:
    branches: [app-v2, main]
    paths:
      - "college-compass-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive, sign and upload to TestFlight (needs the App Store secrets)"
        type: boolean
        default: false
      xcode_version:
        description: "Xcode for the TestFlight job (Apple's current minimum SDK applies to uploads; see APP_STORE.md)"
        type: string
        default: "latest-stable"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.gaddu.collegecompass

defaults:
  run:
    working-directory: college-compass-app

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test + build the web bundle for iOS + compile the app for the simulator.
  #    Unsigned, no secrets required.
  # ---------------------------------------------------------------------------
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: college-compass-app/package-lock.json

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # `cap:sync` = tsc + `BUILD_TARGET=ios vite build` (relative base) + `cap sync ios`,
      # which runs `pod install` (CocoaPods is preinstalled on GitHub macOS runners).
      - name: Build web bundle and sync to iOS project
        env:
          VITE_CC_CHATGPT_CLIENT_ID: ${{ secrets.VITE_CC_CHATGPT_CLIENT_ID }}
          VITE_CC_TOKEN_RELAY: ${{ vars.VITE_CC_TOKEN_RELAY }}
        run: npm run cap:sync

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Boots a simulator and proves the self-serve ChatGPT sign-in callback works inside a real
      # iOS runtime: the app (launched with -ccLoopbackSelfTest) must answer on 127.0.0.1:1455.
      - name: Simulator smoke test (127.0.0.1 sign-in callback + native OpenAI HTTP + PDF render)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(c[-1]["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -ccLoopbackSelfTest -ccNativeHttpSelfTest
          status=000
          for i in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1455/ || true)
            [ "$status" != "000" ] && break
            sleep 2
          done
          echo "GET / -> $status"
          test "$status" = "404"
          code=$(curl -s -o "$RUNNER_TEMP/body.html" -w '%{http_code}' 'http://127.0.0.1:1455/auth/callback?code=ci-test&state=ci-state&client_id=oaiapp_ci')
          echo "GET /auth/callback -> $code"
          test "$code" = "200"
          grep -q "Signed in to Tierwise" "$RUNNER_TEMP/body.html"
          # Native HTTP (OpenAI calls bypass WebView CORS): unauthenticated GET /v1/models must come
          # back 401 from api.openai.com, a cancelled request must abort, and a POST through the background
          # URLSession must reach api.openai.com too.
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          OUT="$DATA/Documents/cc_nativehttp_selftest.txt"
          for i in $(seq 1 60); do [ -s "$OUT" ] && break; sleep 2; done
          cat "$OUT" || true
          echo "::notice title=Native HTTP + PDF self-test::$( [ -s "$OUT" ] && tr '\n' ' ' < "$OUT" || echo 'no result file (timed out)')"
          grep -qx "status=401" "$OUT"
          grep -qx "cancel=ABORTED" "$OUT"
          # AI POST path: background URLSession (keeps running after leaving the app), or the automatic
          # fallback to the normal session where background sessions don't work (the Simulator).
          grep -Eqx "bgstatus=401 via=(background|foreground)" "$OUT"
          # Share as PDF: the HTML report must render natively (UIMarkupTextPrintFormatter) to a
          # paginated Letter PDF with at least one page and a real PDF body (SharePdfPlugin.swift).
          grep -Eqx "pdf_pages=[0-9]+ pdf_bytes=[0-9]+" "$OUT"
          pdf_pages=$(sed -n 's/^pdf_pages=\([0-9]*\) pdf_bytes=[0-9]*$/\1/p' "$OUT")
          pdf_bytes=$(sed -n 's/^pdf_pages=[0-9]* pdf_bytes=\([0-9]*\)$/\1/p' "$OUT")
          echo "PDF self-test: pages=$pdf_pages bytes=$pdf_bytes"
          test "$pdf_pages" -ge 1
          test "$pdf_bytes" -gt 1000
          # App Attest (AppAttestPlugin.swift): the Simulator has no App Attest, so this only shows the plugin
          # is compiled in and DeviceCheck links (expect appattest_supported=false). Informational, never fails.
          grep -Ex "appattest_supported=(true|false)" "$OUT" || echo "::warning title=App Attest self-test::no appattest_supported line in $OUT"
          # Deadline reminders: two test reminders are scheduled, counted, cleared and counted again
          # (DeadlineRemindersPlugin.swift). The Simulator can't grant notification permission
          # unattended, in which case iOS refuses to add them and the plugin reports that instead.
          grep -Eqx "reminders_pending=2 cleared=0|reminders_skipped=not-allowed" "$OUT"
          echo "Deadline reminders self-test: $(grep '^reminders_' "$OUT")"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS "CC_LOOPBACK" OR eventMessage CONTAINS "CC_SHAREPDF" OR eventMessage CONTAINS "CC_DEADLINES"' || true
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/launch.png" || true

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-screenshot
          path: ${{ runner.temp }}/launch.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: CollegeCompass-simulator-app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Manual only: archive with manual signing, export an IPA, upload to
  #    TestFlight. Secrets cannot be read in a job-level `if`, so they are
  #    mapped to env and a first step computes a `ready` output that gates
  #    every later step.
  # ---------------------------------------------------------------------------
  testflight:
    needs: simulator-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      # Signing, option 1 (no Mac needed): Apple cloud-managed signing with the API key above
      # (key role: Admin) + the team ID. Option 2: your own distribution certificate + profile.
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
    steps:
      - name: Check App Store secrets
        id: gate
        working-directory: .
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing APP_STORE_CONNECT_KEY_P8"
          mode=""
          if [ -n "$CERT_P12_B64$CERT_PASSWORD$PROFILE_B64" ]; then
            # Option C (own certificate) is being configured: name exactly what's missing for it.
            mode=manual
            [ -n "$CERT_P12_B64" ]  || missing="$missing IOS_DIST_CERT_P12_BASE64"
            [ -n "$CERT_PASSWORD" ] || missing="$missing IOS_DIST_CERT_PASSWORD"
            [ -n "$PROFILE_B64" ]   || missing="$missing IOS_PROVISION_PROFILE_BASE64"
          elif [ -n "$TEAM_ID" ]; then
            mode=cloud
          else
            missing="$missing APPLE_TEAM_ID(variable, for cloud-managed signing)"
          fi
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=TestFlight upload skipped::Missing:$missing (see college-compass-app/docs/APP_STORE.md)"
            echo "### TestFlight upload skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight signing::$mode"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: college-compass-app/package-lock.json

      - name: Select Xcode
        if: steps.gate.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Unit tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test

      - name: Build web bundle and sync to iOS project
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_CC_CHATGPT_CLIENT_ID: ${{ secrets.VITE_CC_CHATGPT_CLIENT_ID }}
          VITE_CC_TOKEN_RELAY: ${{ vars.VITE_CC_TOKEN_RELAY }}
        run: npm run cap:sync

      - name: Install the App Store Connect API key
        if: steps.gate.outputs.ready == 'true'
        id: asckey
        run: |
          set -euo pipefail
          # altool looks for AuthKey_<KEYID>.p8 in ~/.appstoreconnect/private_keys; xcodebuild takes a path.
          # The secret may hold the raw PEM or a base64 encoding of it.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # ── Option 1: cloud-managed signing (Xcode creates/uses the distribution certificate and
      # profile in your account through the API key; needs an Admin-role key). The archive is
      # built unsigned — signing it for development would need a registered device — and the
      # export step signs it for App Store distribution and uploads it. ──
      - name: Archive and upload (cloud-managed signing)
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.mode == 'cloud'
        env:
          KEY_PATH: ${{ steps.asckey.outputs.path }}
        run: |
          set -euo pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          LOG="$RUNNER_TEMP/xcodebuild.log"
          # Surface Xcode's own error lines as annotations (raw logs aren't always reachable).
          report() {
            grep -E "error:|error -|No profiles|No Accounts|Provisioning|provisioning|certificate|Certificate|not found|App Store Connect|ITMS-|Code Signing|Signing" "$LOG" \
              | grep -v "^\s*$" | sort -u | head -25 | while IFS= read -r line; do echo "::error title=xcodebuild::${line:0:900}"; done
          }
          trap 'report' ERR
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" 2>&1 | tee "$LOG" | grep -E "error|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$LOG" || { report; exit 65; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # destination=upload sends the build straight to App Store Connect / TestFlight.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}" 2>&1 | tee "$LOG" | grep -E "error|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" "$LOG" || { report; exit 65; }
          echo "### Uploaded build $GITHUB_RUN_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      # ── Option 2: your own distribution certificate + App Store provisioning profile. ──
      - name: Import signing certificate and provisioning profile
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.mode == 'manual'
        id: signing
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          if [ "$APP_ID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for '$APP_ID', expected '$TEAM.$BUNDLE_ID'"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM" >> "$GITHUB_OUTPUT"

      # Manual signing is applied to the App target only (a command-line
      # PROVISIONING_PROFILE_SPECIFIER would also hit the Pods targets and fail).
      # Only the two App-target build configurations contain CODE_SIGN_STYLE.
      - name: Archive, export and upload (manual signing)
        if: steps.gate.outputs.ready == 'true' && steps.gate.outputs.mode == 'manual'
        env:
          TEAM: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/g' \
            ios/App/App.xcodeproj/project.pbxproj
          grep -c 'CODE_SIGN_STYLE = Manual' ios/App/App.xcodeproj/project.pbxproj

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "### Uploaded build $GITHUB_RUN_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always() && steps.gate.outputs.ready == 'true'
        run: |
          [ -n "${{ steps.signing.outputs.keychain }}" ] && security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          [ -n "${{ steps.signing.outputs.profile_uuid }}" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
